services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.11
    init: true
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certificate_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
